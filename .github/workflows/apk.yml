name: Gerar APK

# Roda sozinho a cada envio para a branch main, e também pelo botão
# "Run workflow" na aba Actions do GitHub.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write        # necessário para criar a Release com o APK

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Ler a versão do build.gradle.kts
        id: versao
        run: |
          CODIGO=$(grep -m1 'versionCode' app/build.gradle.kts | grep -o '[0-9]\+')
          NOME=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"
          echo "nome=$NOME"     >> "$GITHUB_OUTPUT"
          echo "Versão $NOME (código $CODIGO)"

      - name: Restaurar o google-services.json (segredo)
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            printf '%s' "$GOOGLE_SERVICES" > app/google-services.json
            echo "google-services.json restaurado: login e nuvem ligados."
          else
            echo "::warning::Sem o segredo GOOGLE_SERVICES_JSON — o APK sai sem login nem nuvem."
          fi

      - name: Restaurar a chave de assinatura (segredo)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/motoristapro.jks"
            echo "MOTORISTAPRO_KEYSTORE=$RUNNER_TEMP/motoristapro.jks" >> "$GITHUB_ENV"
            echo "Chave de assinatura restaurada."
          else
            echo "::error::Falta o segredo KEYSTORE_BASE64. Veja docs/atualizacao.md."
            exit 1
          fi

      - name: Compilar o APK assinado
        env:
          MOTORISTAPRO_KEYSTORE_SENHA: ${{ secrets.KEYSTORE_SENHA }}
          MOTORISTAPRO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MOTORISTAPRO_KEY_SENHA: ${{ secrets.KEY_SENHA }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Montar o pacote da Release
        run: |
          mkdir -p publicar
          cp app/build/outputs/apk/release/app-release.apk \
             "publicar/MotoristaPro-${{ steps.versao.outputs.nome }}.apk"

          REPO="${{ github.repository }}"
          TAG="v${{ steps.versao.outputs.nome }}"
          ARQ="MotoristaPro-${{ steps.versao.outputs.nome }}.apk"
          NOTAS=$(git log -1 --pretty=%s | sed 's/"/\\"/g')

          cat > publicar/versao.json <<FIM
          {
            "versionCode": ${{ steps.versao.outputs.codigo }},
            "versionName": "${{ steps.versao.outputs.nome }}",
            "url": "https://github.com/$REPO/releases/download/$TAG/$ARQ",
            "notas": "$NOTAS",
            "obrigatoria": false
          }
          FIM
          cat publicar/versao.json

      - name: Publicar a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.nome }}
          name: MotoristaPro ${{ steps.versao.outputs.nome }}
          body: |
            Versão ${{ steps.versao.outputs.nome }} (código ${{ steps.versao.outputs.codigo }}).

            No celular: **Mais > Versão do app > Procurar atualização**.
          files: |
            publicar/MotoristaPro-${{ steps.versao.outputs.nome }}.apk
            publicar/versao.json
