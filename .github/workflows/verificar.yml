name: Verificar build

# Compila e roda os testes nas branches de trabalho, ANTES de ir para a main.
# Nao gera Release nem APK assinado: so diz se o codigo compila.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'docs/**'
      - 'mockups/**'
      - 'README.md'
      - 'APAGAR.txt'
  # Botão "Run workflow" na aba Actions: roda de novo quando o GitHub perde o
  # aviso de um push (aconteceu na 4.17.0).
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar e testar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
